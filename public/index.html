<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Job Matcher</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Resume Job Matcher</h1>
        <p class="subtitle">
          Upload your resume and we'll find matching jobs based on your skills.
        </p>
      </header>

      <section class="card">
        <form id="upload-form">
          <label class="field">
            <span>Resume &mdash; pick any file (works best with PDF, DOCX, or TXT)</span>
            <input
              type="file"
              id="resume"
              name="resume"
              required
            />
          </label>

          <label class="field">
            <span>Location (optional)</span>
            <input
              type="text"
              id="location"
              name="location"
              placeholder="e.g. Bangalore, Remote"
            />
          </label>

          <button type="submit" id="submit-btn">Find Jobs</button>
        </form>
      </section>

      <section id="status" class="status" hidden></section>

      <section id="skills-section" class="card" hidden>
        <h2>Skills detected</h2>
        <div id="skills" class="chips"></div>
      </section>

      <section id="jobs-section" hidden>
        <h2 id="jobs-heading">Matching jobs</h2>
        <div id="jobs"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
